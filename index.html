<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas - WebGPU World Map</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0c10;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
    }

    .controls button {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .info {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      z-index: 100;
    }

    .info code {
      color: #66fcf1;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
    <button id="theme-toggle" onclick="toggleTheme()">☀</button>
    <button id="data-toggle" onclick="toggleData()">◐</button>
  </div>

  <div class="info">
    Click anywhere: <code id="coords">-</code>
  </div>

  <script type="module">
    import { Atlas } from './src/index.ts'

    // Natural Earth GeoJSON (low-res countries)
    const GEO_URL = 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson'

    const map = new Atlas({
      container: '#map',
      theme: 'dark',
      center: [0, 20],
      zoom: 1
    })

    // Sample GDP data (2023, in billions USD)
    const gdpData = [
      { key: 'USA', value: 25500 },
      { key: 'CHN', value: 18000 },
      { key: 'JPN', value: 4200 },
      { key: 'DEU', value: 4100 },
      { key: 'IND', value: 3500 },
      { key: 'GBR', value: 3100 },
      { key: 'FRA', value: 2800 },
      { key: 'BRA', value: 2100 },
      { key: 'ITA', value: 2000 },
      { key: 'CAN', value: 1900 },
      { key: 'RUS', value: 1800 },
      { key: 'KOR', value: 1700 },
      { key: 'AUS', value: 1600 },
      { key: 'MEX', value: 1400 },
      { key: 'ESP', value: 1400 },
      { key: 'IDN', value: 1300 },
      { key: 'SAU', value: 1100 },
      { key: 'NLD', value: 1000 },
      { key: 'TUR', value: 900 },
      { key: 'CHE', value: 800 },
    ]

    let showData = false
    let choroplethLayer = null

    // Load country layer
    map.addCountryLayer(GEO_URL).then(() => {
      console.log('Countries loaded!')
    })

    // Click handler
    map.on('click', (e) => {
      document.getElementById('coords').textContent =
        `${e.lngLat[0].toFixed(2)}, ${e.lngLat[1].toFixed(2)}`
    })

    // Expose functions for buttons
    let isDark = true

    const getChoroplethStyle = () => {
      const colors = isDark
        ? ['#2a3a45', '#4a6868']
        : ['#f0e2d5', '#E8CDA9']
      return { colors, defaultColor: colors[0] }
    }

    window.toggleTheme = () => {
      isDark = !isDark
      map.setTheme(isDark ? 'dark' : 'light')
      document.getElementById('theme-toggle').textContent = isDark ? '☀' : '☾'
      // Update choropleth colors for new theme
      if (showData && choroplethLayer) {
        const { colors, defaultColor } = getChoroplethStyle()
        choroplethLayer.setValues(gdpData, { colors, defaultColor })
        map.refresh()
      }
    }
    window.toggleData = async () => {
      showData = !showData
      const { colors, defaultColor } = getChoroplethStyle()

      if (showData) {
        if (!choroplethLayer) {
          choroplethLayer = await map.addChoroplethLayer('gdp', GEO_URL, gdpData, {
            colors,
            defaultColor
          })
        } else {
          choroplethLayer.setValues(gdpData, { colors, defaultColor })
          choroplethLayer.setVisible(true)
          map.refresh()
        }
        document.getElementById('data-toggle').textContent = '◑'
      } else {
        if (choroplethLayer) {
          choroplethLayer.setVisible(false)
          map.refresh()
        }
        document.getElementById('data-toggle').textContent = '◐'
      }
    }
    window.zoomIn = () => map.setZoom((map.getZoom() || 1) * 1.5)
    window.zoomOut = () => map.setZoom((map.getZoom() || 1) / 1.5)
    window.map = map
  </script>
</body>
</html>
